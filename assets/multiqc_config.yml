report_comment: >
  This report has been generated by the <a href="https://github.com/grothlab/glseq" target="_blank">grothlab/glseq</a>
  analysis pipeline. For information about how to interpret these results, please see the <a href="https://github.com/grothlab/glseq/blob/main/docs/output.md" target="_blank">documentation</a>.

data_format: "yaml"

report_section_order:
  # Preprocessing and prealignment QC
  fastqc_raw:
    order: 4004
  cutadapt:
    order: 4003
  fastqc_trimmed:
    order: 4002
  peak_count:
    before: mlib_deeptools
  frip_score:
    before: peak_count
  peak_annotation:
    before: frip_score
  strand_shift_correlation:
    before: peak_annotation
  nsc_coefficient:
    before: strand_shift_correlation
  rsc_coefficient:
    before: nsc_coefficient
  mlib_featurecounts:
    before: rsc_coefficient
  deseq2_pca_1:
    order: -1600
  deseq2_pca_2:
    order: -1700
  deseq2_pca_3:
    order: -1800
  deseq2_pca_4:
    order: -1900
  deseq2_pca_5:
    order: -2000
  deseq2_pca_6:
    order: -2100
  deseq2_pca_7:
    order: -2200
  deseq2_pca_8:
    order: -2300
  deseq2_pca_9:
    order: -2400
  deseq2_pca_10:
    order: -2500
  deseq2_clustering_1:
    order: -2600
  deseq2_clustering_2:
    order: -2700
  deseq2_clustering_3:
    order: -2800
  deseq2_clustering_4:
    order: -2900
  deseq2_clustering_5:
    order: -3000
  deseq2_clustering_6:
    order: -3100
  deseq2_clustering_7:
    order: -3200
  deseq2_clustering_8:
    order: -3300
  deseq2_clustering_9:
    order: -3400
  deseq2_clustering_10:
    order: -3500
  mlib_genrich_peak_count:
    before: deseq2_clustering_1
  mlib_genrich_frip_score:
    before: mlib_genrich_peak_count
  mlib_genrich_peak_annotation:
    before: mlib_genrich_frip_score
  # Summaries
  "grothlab-glseq-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "grothlab-glseq-summary":
    order: -1002


export_plots: true
#exclude_modules:
#  - "general_stats"

disable_version_detection: true

# Order of modules

module_order:
  - fastqc:
      anchor: "fastqc_raw"
      name: "LIB: FastQC (raw)"
      info: "This section of the report shows FastQC results for individual libraries before trimming."
      path_filters:
        # - "./fastqc/*.zip"
  - cutadapt:
      anchor: "cutadapt"
      name: "LIB: TrimGalore!/Cutadapt (trimmed)"
      info: "This section of the report shows the length of trimmed reads by Cutadapt (within TrimGalore) for individual libraries."
  - fastqc:
      anchor: "fastqc_trimmed"
      name: "LIB: FastQC (trimmed)"
      info: "This section of the report shows FastQC results for individual libraries after trimming."
      path_filters:
        # - "./trimgalore/fastqc/*.zip"
  - samtools:
      anchor: "samtools_alignment"
      name: "LIB: SAMTools (alignment)"
      info: "This section of the report shows SAMTools alignment stats for individual libraries."
      path_filters:
        # - "./alignment/library/*"
  - samtools:
      anchor: "samtools_unfiltered"
      name: "MERGED LIB: SAMTools (unfiltered)"
      info: "This section of the report shows SAMTools alignment stats after merging libraries and before filtering."
      path_filters:
        - "./alignment/mergedLibrary/*"
  # - picard:
  #     name: "MERGED LIB: Picard (unfiltered)"
  #     info: "This section of the report shows picard results after merging libraries and before filtering."
  #     path_filters:
  #       - "./alignment/mergedLibrary/unfiltered/picard_metrics/*"
  # - preseq:
  #     name: "MERGED LIB: Preseq (unfiltered)"
  #     info: "This section of the report shows Preseq results after merging libraries and before filtering."
  #     path_filters:
  #       - "./alignment/mergedLibrary/preseq/*"
  # - umitools/dedup:
  #     name: "MERGED LIB: UMI-tools dedup"
  #     info: "This section of the report shows UMI-tools dedup results after merging libraries."
  #     path_filters:
  #       - "./alignment/mergedLibrary/umi_dedup/*"
  - picard:
      name: "MERGED LIB: Picard MarkDuplicates (unfiltered)"
      info: "This section of the report shows Picard MarkDuplicates results after merging libraries and before filtering."
      path_filters:
        - "./alignment/mergedLibrary/picard_markduplicates/*"  
  - samtools:
      anchor: "samtools_flT1"
      name: "MERGED LIB: SAMTools (flT1)"
      info: "This section of the report shows SAMTools alignment stats after merging libraries and improper-pair and duplicate filtering."
      # path_filters:
      #   - "./alignment/mergedLibrary/umi_dedup/*"
  - samtools:
      name: "MERGED LIB: SAMTools (marked duplicates)"
      info: "This section of the report shows SAMTools results after merging libraries and after marking duplicates."
      path_filters:
        - "./alignment/mergedLibrary/picard_markduplicates/*"
  - samtools:
      name: "MERGED LIB: SAMTools (filtered)"
      info: "This section of the report shows SAMTools results after merging libraries and after filtering with SAMBAMBA."
      path_filters:
        - "./alignment/mergedLibrary/bam_filter/*"
  - samtools:
      name: "MERGED LIB: SAMTools (spike-in)"
      info: "This section of the report shows SAMTools results after merging libraries, filtering with SAMBAMBA, and splitting by spike-in."
      path_filters:
        - "./alignment/mergedLibrary/spikein_split/*"
  - samtools:
      name: "MERGED LIB: SAMTools (allocated multimappers)"
      info: "This section of the report shows SAMTools results after merging libraries, filtering with SAMBAMBA, splitting by spike-in, and allocating multimappers."
      path_filters:
        - "./alignment/mergedLibrary/multimap/*"
  - picard:
      name: "MERGED LIB: Picard (filtered)"
      info: "This section of the report shows picard results after merging libraries and after filtering."
      path_filters:
        - "./alignment/mergedLibrary/filtered/picard_metrics/*"
  - deeptools:
      name: "MERGED LIB: deepTools"
      anchor: "mlib_deeptools"
      info: "This section of the report shows ChIP-seq QC plots generated by deepTools."
  - featureCounts:
      name: "MERGED LIB: featureCounts"
      anchor: "mlib_featurecounts"
      info: "This section of the report shows featureCounts results for the number of reads assigned to merged library consensus peaks."
      path_filters:
        - "./macs3/featurecounts/*.summary"

custom_plot_config:
  picard_insert_size:
    cpswitch_c_active: False
    smooth_points: 1000
  featurecounts:
    cpswitch_c_active: False

extra_fn_clean_exts:
  - "fastq.gz"
  - "_trimmed"
  - "_val"
  - "sorted.bam"
  - ".Lb"
  - "mkD"
  - "clN"
  - "mLb"
  - "_peaks"
  - ".FRiP"
  - ".peak"
  - "_spp"
  - ".spp"
  - "lc_extrap"

# # Customise the module search patterns to speed up execution time
# #  - Skip module sub-tools that we are not interested in
# #  - Replace file-content searching with filename pattern searching
# #  - Don't add anything that is the same as the MultiQC default
# # See https://multiqc.info/docs/#optimise-file-search-patterns for details
sp:
  cutadapt:
    fn: "*trimming_report.txt"
  preseq:
    fn: "*.lc_extrap.txt"
  deeptools/plotFingerprintOutRawCounts:
    fn: "*plotFingerprint*"
  deeptools/plotProfile:
    fn: "*plotProfile*"
  phantompeakqualtools/out:
    fn: "*.spp.out"

