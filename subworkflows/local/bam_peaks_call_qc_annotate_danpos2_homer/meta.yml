# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "bam_peaks_call_qc_annotate_danpos2_homer"
description: |
  Call nucleosome/chromatin peaks with DANPOS2, removing scaffold contigs first. The specific
  DANPOS2 mode (dpeak, dpos, dregion or dtriple) is chosen via peak_caller.
keywords:
  - danpos2
  - nucleosome
  - peak-calling
components:
  - bam_remove_scaffolds
  - danpos2/dpeak
  - danpos2/dpos
  - danpos2/dregion
  - danpos2/dtriple
input:
  - ch_bam:
      description: |
        IP BAM file(s) and matched input control
        Structure: [ val(meta), [ path(ip_bam) ], [ path(control_bam) ] ]
  - peak_caller:
      type: string
      description: |
        DANPOS2 mode to run: 'dpeak', 'dpos', 'dregion' or 'dtriple'
output:
  - dpeak_pooled_xls:
      description: |
        Pooled DANPOS2 dpeak XLS output, when peak_caller is 'dpeak'
        Structure: [ val(meta), path(xls) ]
authors:
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
