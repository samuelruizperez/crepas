# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "bam_split_by_strand"
description: Split a BAM file into forward- and reverse-strand alignments, using SAM FLAG 16 (read reverse strand) and the sample's library strandedness
keywords:
  - bam
  - strand
  - samtools
  - split
tools:
  - samtools:
      description: |
        SAMtools is a suite of programs for interacting with high-throughput sequencing data in
        SAM/BAM/CRAM format. Used here (via two `samtools view` calls with `--exclude-flags`/
        `--require-flags 16`) to separate alignments into forward- and reverse-strand BAM files,
        accounting for the library's strandedness (`meta.strandedness`).
      homepage: http://www.htslib.org/
      documentation: http://www.htslib.org/doc/samtools.html
      tool_dev_url: https://github.com/samtools/samtools
      doi: "10.1093/bioinformatics/btp352"
      licence: ["MIT"]
      identifier: "biotools:samtools"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information, including library strandedness
          e.g. [ id:'test', single_end:false, strandedness:'forward' ]
    - bam:
        type: file
        description: BAM file to split by strand
        pattern: "*.bam"
        ontologies:
          - edam: "http://edamontology.org/format_2572" # BAM
output:
  f_bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.forward.bam":
          type: file
          description: BAM file containing forward-strand alignments
          pattern: "*.forward.bam"
          ontologies:
            - edam: "http://edamontology.org/format_2572" # BAM
  r_bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.reverse.bam":
          type: file
          description: BAM file containing reverse-strand alignments
          pattern: "*.reverse.bam"
          ontologies:
            - edam: "http://edamontology.org/format_2572" # BAM
  versions_samtools:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "samtools":
          type: string
          description: The name of the tool
      - "samtools version | sed '1!d;s/.* //'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "samtools":
          type: string
          description: The name of the tool
      - "samtools version | sed '1!d;s/.* //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
