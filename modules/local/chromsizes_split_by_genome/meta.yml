# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "chromsizes_split_by_genome"
description: Split a hybrid (endogenous + spike-in) chromosome sizes file into separate endogenous and exogenous sizes files, based on a spike-in genome name suffix appended to spike-in chromosome/contig names
keywords:
  - awk
  - chromsizes
  - spikein
  - genome
tools:
  - gawk:
      description: |
        GNU Awk (gawk) is a text-processing language for extracting and reporting data. Used
        here to split a combined chromosome sizes file (produced from a hybrid genome FASTA
        whose spike-in contigs were suffixed with `_<spikein_genome>`, e.g. by
        BUILD_HYBRID_FASTA) into an endogenous sizes file (contigs without the suffix) and an
        exogenous/spike-in sizes file (contigs with the suffix, suffix stripped).
      homepage: https://www.gnu.org/software/gawk/
      documentation: https://www.gnu.org/software/gawk/manual/gawk.html
      tool_dev_url: http://savannah.gnu.org/projects/gawk/
      licence: ["GPL-3.0-or-later"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - sizes:
        type: file
        description: Combined chromosome sizes file (2-column TSV: name, length) for the hybrid endogenous + spike-in genome, with spike-in contigs named `<contig>_<spikein_genome>`
        pattern: "*.sizes"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
  - - exo_genome_string:
        type: string
        description: Suffix identifying spike-in (exogenous) contig names, e.g. the spike-in genome name used by BUILD_HYBRID_FASTA
  - - endo_genome_string:
        type: string
        description: Unused for filtering (retained for tagging/naming symmetry with exo_genome_string); endogenous contigs are simply those without the exogenous suffix
output:
  endo_sizes:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.${endo_genome_string}.sizes":
          type: file
          description: Chromosome sizes file containing only endogenous (non-spike-in) contigs
          pattern: "*.sizes"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  exo_sizes:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.${exo_genome_string}.sizes":
          type: file
          description: Chromosome sizes file containing only exogenous (spike-in) contigs, with the spike-in suffix stripped from contig names
          pattern: "*.sizes"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  versions_awk:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "awk":
          type: string
          description: The name of the tool
      - "awk -Wversion 2>&1 | head -1 | sed 's/^GNU Awk //; s/,.*//'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "awk":
          type: string
          description: The name of the tool
      - "awk -Wversion 2>&1 | head -1 | sed 's/^GNU Awk //; s/,.*//'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@samuelruizperez"
maintainers:
  - "@samuelruizperez"
